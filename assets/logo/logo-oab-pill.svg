<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="280" viewBox="0 0 1600 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Onboarding Assistant Bot pill logo">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1DBFF"/>
      <stop offset="50%" stop-color="#E2CBF7"/>
      <stop offset="100%" stop-color="#D6F6FF"/>
