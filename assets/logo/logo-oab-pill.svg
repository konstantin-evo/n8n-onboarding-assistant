  <rect x="10" y="10" width="1580" height="260" rx="56" fill="url(#gradBg)" filter="url(#drop)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-weight="800" text-anchor="middle">
    <text x="800" y="165" font-size="88" fill="#111111" opacity="0.12">Onboarding Assistant Bot</text>
    <text x="800" y="160" font-size="88" fill="#ffffff">Onboarding Assistant Bot</text>
