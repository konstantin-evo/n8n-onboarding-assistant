<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="360" viewBox="0 0 1800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Onboarding Assistant Bot logo">
  <defs>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1DBFF"/>
      <stop offset="50%" stop-color="#E2CBF7"/>
      <stop offset="100%" stop-color="#D6F6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-weight="800" font-size="96"
     text-anchor="middle" letter-spacing="0.5" filter="url(#softShadow)">
    <text x="900" y="205" fill="url(#gradText)">Onboarding Assistant Bot</text>
  </g>
  <rect x="470" y="230" width="860" height="10" rx="5" fill="url(#gradText)" opacity="0.25"/>
</svg>
